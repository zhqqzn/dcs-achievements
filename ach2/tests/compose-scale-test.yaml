services:
  # Поднимаем вторую независимую копию сервера приложений, чтобы проверить общую БД.
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-linear}
      DB_USER: ${DB_USER:-linear}
      DB_PASSWORD: ${DB_PASSWORD:-coursework_demo_password}
      MAX_INPUT: ${MAX_INPUT:-9223372036854775806}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # Добавляем отдельный HTTP-вход, чтобы направлять проверки непосредственно в app2.
  web2:
    image: nginx:1.28-alpine
    ports:
      - "${TEST_WEB2_PORT:-18081}:80"
    volumes:
      - ./nginx/test-second.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app2:
        condition: service_healthy
    restart: unless-stopped
