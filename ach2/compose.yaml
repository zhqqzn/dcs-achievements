# Поднимаем инфраструктурные компоненты в общей внутренней сети Compose.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-linear}
      POSTGRES_USER: ${DB_USER:-linear}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coursework_demo_password}
    # Сохраняем историю запросов между пересозданиями контейнера.
    # SQL из docker-entrypoint-initdb.d выполняется только для нового пустого тома.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Сервер приложений не публикуем на хост: к нему обращается Nginx по имени app.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-linear}
      DB_USER: ${DB_USER:-linear}
      DB_PASSWORD: ${DB_PASSWORD:-coursework_demo_password}
      MAX_INPUT: ${MAX_INPUT:-9223372036854775806}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # Единственная внешняя точка входа: Nginx передаёт HTTP-запросы приложению.
  web:
    image: nginx:1.28-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
